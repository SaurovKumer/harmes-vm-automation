name: Harmes VM 30-Minute Guard

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: harmes-vm-lifecycle
  cancel-in-progress: true

env:
  RESOURCE_GROUP: harmes-vm_group
  VM_NAME: harmes-vm

jobs:
  run-vm:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Start VM and guard its runtime
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo

          RG = os.environ["RESOURCE_GROUP"]
          VM = os.environ["VM_NAME"]
          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = str(os.environ["TELEGRAM_CHAT_ID"])
          DHAKA = ZoneInfo("Asia/Dhaka")
          API = f"https://api.telegram.org/bot{TOKEN}"

          def az(*args, check=True):
              p = subprocess.run(
                  ["az", *args],
                  text=True,
                  capture_output=True
              )
              if check and p.returncode != 0:
                  print(p.stdout)
                  print(p.stderr)
                  raise SystemExit(p.returncode)
              return p.stdout.strip()

          def vm_id():
              return az("vm", "show", "-g", RG, "-n", VM, "--query", "id", "-o", "tsv")

          def tags():
              raw = az("vm", "show", "-g", RG, "-n", VM, "--query", "tags", "-o", "json")
              try:
                  return json.loads(raw or "{}") or {}
              except Exception:
                  return {}

          def set_tags(**values):
              args = [
                  "tag", "update",
                  "--resource-id", vm_id(),
                  "--operation", "Merge",
                  "--tags",
              ]
              args.extend([f"{k}={v}" for k, v in values.items()])
              az(*args)

          def power_state():
              out = az(
                  "vm", "get-instance-view",
                  "-g", RG, "-n", VM,
                  "--query", "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]",
                  "-o", "tsv",
                  check=False
              )
              return out or "Unknown"

          def tg(method, payload=None, timeout=20):
              data = urllib.parse.urlencode(payload or {}).encode()
              req = urllib.request.Request(f"{API}/{method}", data=data)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          def send(text, keyboard=None):
              payload = {
                  "chat_id": CHAT_ID,
                  "text": text,
              }
              if keyboard is not None:
                  payload["reply_markup"] = json.dumps({"inline_keyboard": keyboard})
              try:
                  tg("sendMessage", payload)
              except Exception as e:
                  print("Telegram send failed:", e)

          def answer_callback(callback_id, text):
              try:
                  tg("answerCallbackQuery", {
                      "callback_query_id": callback_id,
                      "text": text,
                  })
              except Exception as e:
                  print("Callback answer failed:", e)

          def dhaka_text(epoch):
              return datetime.fromtimestamp(int(epoch), DHAKA).strftime("%Y-%m-%d %I:%M %p")

          def remaining_text(epoch):
              sec = max(0, int(epoch) - int(time.time()))
              h, rem = divmod(sec, 3600)
              m = rem // 60
              if h:
                  return f"{h}h {m}m"
              return f"{m}m"

          def current_deadline():
              t = tags()
              try:
                  return int(t.get("RunUntilEpoch", "0") or 0)
              except Exception:
                  return 0

          def state_label(state):
              s = (state or "").lower()
              if "deallocated" in s:
                  return "🔴 DEALLOCATED"
              if "stopped" in s:
                  return "🟠 STOPPED (NOT DEALLOCATED)"
              if "running" in s:
                  return "🟢 RUNNING"
              return state or "Unknown"

          def status_message():
              state = power_state()
              deadline = current_deadline()
              label = state_label(state)
              if deadline > int(time.time()):
                  return (
                      f"🖥 {VM}\n"
                      f"Status: {label}\n"
                      f"⏳ Planned deallocation: {dhaka_text(deadline)}\n"
                      f"⌛ Remaining: {remaining_text(deadline)}"
                  )
              return (
                  f"🖥 {VM}\n"
                  f"Status: {label}\n"
                  f"⏳ Planned deallocation: not currently set"
              )

          def warning_keyboard(deadline):
              d = str(deadline)
              return [
                  [
                      {"text": "⏱ +30 min", "callback_data": f"keep30|{d}"},
                      {"text": "⏱ +1 hour", "callback_data": f"keep60|{d}"}
                  ],
                  [
                      {"text": "⏱ +2 hours", "callback_data": f"keep120|{d}"},
                      {"text": "⏱ +3 hours", "callback_data": f"keep180|{d}"}
                  ],
                  [
                      {"text": "⏱ +4 hours", "callback_data": f"keep240|{d}"}
                  ],
                  [
                      {"text": "📊 Status", "callback_data": f"status|{d}"},
                      {"text": "🛑 Deallocate now", "callback_data": f"shutdown|{d}"}
                  ]
              ]

          def send_warning(deadline):
              set_tags(WarningForEpoch=deadline)
              send(
                  f"⚠️ {VM} will be deallocated in about 5 minutes.\n"
                  f"Scheduled: {dhaka_text(deadline)}\n\n"
                  f"If you do nothing, the VM will be DEALLOCATED automatically.",
                  warning_keyboard(deadline)
              )

          def deallocate(reason):
              print("Deallocating VM:", reason)
              az("vm", "deallocate", "-g", RG, "-n", VM, "--no-wait")
              set_tags(
                  RunUntilEpoch=0,
                  RunUntilLocal="none",
                  WarningForEpoch=0,
                  LastPowerState="deallocated"
              )
              send(f"🛑 {VM}: deallocation requested.\nReason: {reason}")

          def extend(minutes):
              now = int(time.time())
              old = current_deadline()
              base = old if old > now else now
              new_deadline = base + minutes * 60
              set_tags(
                  RunUntilEpoch=new_deadline,
                  RunUntilLocal=datetime.fromtimestamp(new_deadline, DHAKA).strftime("%Y-%m-%d_%H:%M"),
                  WarningForEpoch=0
              )
              send(
                  f"✅ {VM} extended by {minutes} minutes.\n"
                  f"New planned deallocation: {dhaka_text(new_deadline)}"
              )
              return new_deadline

          def process_update(update):
              now = int(time.time())

              cq = update.get("callback_query")
              if cq:
                  msg = cq.get("message") or {}
                  chat = msg.get("chat") or {}
                  if str(chat.get("id")) != CHAT_ID:
                      return

                  data = cq.get("data", "")
                  callback_id = cq.get("id")
                  parts = data.split("|", 1)
                  action = parts[0]
                  expected = int(parts[1]) if len(parts) == 2 and parts[1].isdigit() else 0
                  current = current_deadline()

                  if action != "status" and expected and current != expected:
                      answer_callback(callback_id, "This button has expired.")
                      return

                  if action == "keep30":
                      answer_callback(callback_id, "Extended +30 minutes")
                      extend(30)
                  elif action == "keep60":
                      answer_callback(callback_id, "Extended +1 hour")
                      extend(60)
                  elif action == "keep120":
                      answer_callback(callback_id, "Extended +2 hours")
                      extend(120)
                  elif action == "keep180":
                      answer_callback(callback_id, "Extended +3 hours")
                      extend(180)
                  elif action == "keep240":
                      answer_callback(callback_id, "Extended +4 hours")
                      extend(240)
                  elif action == "shutdown":
                      answer_callback(callback_id, "Deallocating VM")
                      deallocate("Telegram button")
                  elif action == "status":
                      answer_callback(callback_id, "Status sent")
                      send(status_message())
                  return

              msg = update.get("message") or {}
              chat = msg.get("chat") or {}
              if str(chat.get("id")) != CHAT_ID:
                  return
              text = (msg.get("text") or "").strip().split("@", 1)[0].lower()

              if text == "/status":
                  send(status_message())
              elif text == "/keep30":
                  extend(30)
              elif text == "/keep60":
                  extend(60)
              elif text == "/keep120":
                  extend(120)
              elif text == "/keep180":
                  extend(180)
              elif text == "/keep240":
                  extend(240)
              elif text in ("/deallocate", "/shutdown"):
                  deallocate("Telegram command")
              elif text == "/help":
                  send(
                      "Commands:\n"
                      "/status - current VM status and planned deallocation\n"
                      "/keep30 - extend deallocation by 30 minutes\n"
                      "/keep60 - extend deallocation by 1 hour\n"
                      "/keep120 - extend deallocation by 2 hours\n"
                      "/keep180 - extend deallocation by 3 hours\n"
                      "/keep240 - extend deallocation by 4 hours\n"
                      "/deallocate - deallocate now\n"
                      "/shutdown - alias for /deallocate"
                  )

          print("Starting VM...")
          az("vm", "start", "-g", RG, "-n", VM)

          deadline = int(time.time()) + 30 * 60
          set_tags(
              RunUntilEpoch=deadline,
              RunUntilLocal=datetime.fromtimestamp(deadline, DHAKA).strftime("%Y-%m-%d_%H:%M"),
              WarningForEpoch=0,
              LastPowerState="running"
          )

          send(
              f"🟢 {VM} is running.\n"
              f"Automatic deallocation: {dhaka_text(deadline)}\n"
              f"You will get another warning 5 minutes before DEALLOCATION.\n\n"
              f"Send /status anytime to check."
          )

          offset = None

          while True:
              now = int(time.time())
              deadline = current_deadline()

              if deadline <= 0:
                  print("No active deadline. Ending lifecycle job.")
                  break

              if deadline <= now:
                  # Re-read once in case another workflow just extended it.
                  time.sleep(2)
                  deadline2 = current_deadline()
                  if deadline2 > int(time.time()):
                      continue
                  deallocate("30-minute timer expired with no extension")
                  break

              seconds_left = deadline - now

              # If the VM was extended far into the future, hand control to the
              # 5-minute monitor so this GitHub job does not hit its max runtime.
              if seconds_left > 4 * 3600:
                  send(
                      f"ℹ️ Long extension saved until {dhaka_text(deadline)}.\n"
                      f"The background monitor will handle the warning and deallocation."
                  )
                  break

              if seconds_left > 300:
                  # Wake up at least every 60s so external Telegram commands/tags
                  # can be noticed even if another workflow consumed the update.
                  time.sleep(min(60, max(1, seconds_left - 300)))
                  continue

              t = tags()
              warned_for = str(t.get("WarningForEpoch", "0"))
              if warned_for != str(deadline):
                  send_warning(deadline)

              # During the final 5 minutes, poll Telegram quickly.
              window_end = deadline
              while int(time.time()) < window_end:
                  # If another workflow changed the deadline, leave this window.
                  live_deadline = current_deadline()
                  if live_deadline != deadline:
                      break
                  if live_deadline <= 0:
                      break

                  payload = {
                      "timeout": 10,
                      "allowed_updates": json.dumps(["message", "callback_query"])
                  }
                  if offset is not None:
                      payload["offset"] = offset

                  try:
                      result = tg("getUpdates", payload, timeout=15)
                      for upd in result.get("result", []):
                          offset = int(upd["update_id"]) + 1
                          process_update(upd)
                  except Exception as e:
                      print("Telegram polling issue:", e)
                      time.sleep(3)

              # Loop back: if user extended, a new deadline will be picked up.
              # If not, the top of the loop deallocates.

          print("Lifecycle workflow finished.")
          PY
