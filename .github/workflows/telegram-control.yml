name: Telegram VM Status & Safety Monitor

on:
  schedule:
    # GitHub's minimum scheduled interval is 5 minutes.
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: harmes-vm-telegram-monitor
  cancel-in-progress: false

env:
  RESOURCE_GROUP: harmes-vm_group
  VM_NAME: harmes-vm

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Login to Azure
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Process Telegram commands and enforce shutdown
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          python3 <<'PY'
          import json
          import os
          import subprocess
          import time
          import urllib.parse
          import urllib.request
          from datetime import datetime, timedelta, timezone
          from zoneinfo import ZoneInfo

          RG = os.environ["RESOURCE_GROUP"]
          VM = os.environ["VM_NAME"]
          TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = str(os.environ["TELEGRAM_CHAT_ID"])
          DHAKA = ZoneInfo("Asia/Dhaka")
          API = f"https://api.telegram.org/bot{TOKEN}"

          def az(*args, check=True):
              p = subprocess.run(["az", *args], text=True, capture_output=True)
              if check and p.returncode != 0:
                  print(p.stdout)
                  print(p.stderr)
                  raise SystemExit(p.returncode)
              return p.stdout.strip()

          def vm_id():
              return az("vm", "show", "-g", RG, "-n", VM, "--query", "id", "-o", "tsv")

          def tags():
              raw = az("vm", "show", "-g", RG, "-n", VM, "--query", "tags", "-o", "json")
              try:
                  return json.loads(raw or "{}") or {}
              except Exception:
                  return {}

          def set_tags(**values):
              args = ["tag", "update", "--resource-id", vm_id(), "--operation", "Merge", "--tags"]
              args.extend([f"{k}={v}" for k, v in values.items()])
              az(*args)

          def power_state():
              out = az(
                  "vm", "get-instance-view",
                  "-g", RG, "-n", VM,
                  "--query", "instanceView.statuses[?starts_with(code, 'PowerState/')].displayStatus | [0]",
                  "-o", "tsv",
                  check=False
              )
              return out or "Unknown"

          def is_running():
              return "running" in power_state().lower()

          def stable_state(raw):
              s = (raw or "").lower()
              if "running" in s:
                  return "running"
              if "deallocated" in s:
                  return "deallocated"
              if "stopped" in s:
                  return "stopped"
              return ""

          def tg(method, payload=None, timeout=20):
              data = urllib.parse.urlencode(payload or {}).encode()
              req = urllib.request.Request(f"{API}/{method}", data=data)
              with urllib.request.urlopen(req, timeout=timeout) as r:
                  return json.load(r)

          def send(text, keyboard=None):
              payload = {"chat_id": CHAT_ID, "text": text}
              if keyboard is not None:
                  payload["reply_markup"] = json.dumps({"inline_keyboard": keyboard})
              try:
                  tg("sendMessage", payload)
              except Exception as e:
                  print("Telegram send failed:", e)

          def answer_callback(callback_id, text):
              try:
                  tg("answerCallbackQuery", {"callback_query_id": callback_id, "text": text})
              except Exception as e:
                  print("Callback answer failed:", e)

          def current_deadline():
              t = tags()
              try:
                  return int(t.get("RunUntilEpoch", "0") or 0)
              except Exception:
                  return 0

          def auto_start_settings():
              t = tags()
              enabled = str(t.get("AutoStartEnabled", "true") or "true").lower() == "true"
              hhmm = str(t.get("AutoStartTime", "06:00") or "06:00")
              last_date = str(t.get("AutoStartLastDate", "") or "")
              return enabled, hhmm, last_date

          def auto_start_text():
              enabled, hhmm, _ = auto_start_settings()
              if not enabled:
                  return "OFF"
              try:
                  dt = datetime.strptime(hhmm, "%H:%M")
                  return dt.strftime("%I:%M %p")
              except Exception:
                  return hhmm

          def cost_message(days):
              # Cost data is queried for this VM's resource group.
              # Azure Cost Management data can be delayed, so this is the
              # latest available cost, not a real-time meter.
              subscription_id = az("account", "show", "--query", "id", "-o", "tsv")
              end = datetime.now(timezone.utc)
              start = end - timedelta(days=days)

              body = {
                  "type": "Usage",
                  "timeframe": "Custom",
                  "timePeriod": {
                      "from": start.strftime("%Y-%m-%dT%H:%M:%SZ"),
                      "to": end.strftime("%Y-%m-%dT%H:%M:%SZ")
                  },
                  "dataset": {
                      "granularity": "None",
                      "aggregation": {
                          "totalCost": {
                              "name": "PreTaxCost",
                              "function": "Sum"
                          }
                      }
                  }
              }

              url = (
                  f"https://management.azure.com/subscriptions/{subscription_id}"
                  f"/resourceGroups/{RG}/providers/Microsoft.CostManagement/query"
                  f"?api-version=2026-06-01"
              )

              p = subprocess.run(
                  [
                      "az", "rest",
                      "--method", "post",
                      "--url", url,
                      "--headers", "Content-Type=application/json",
                      "--body", json.dumps(body),
                      "-o", "json"
                  ],
                  text=True,
                  capture_output=True
              )

              if p.returncode != 0:
                  err = (p.stderr or p.stdout or "").strip()
                  short = err[-700:] if err else "Unknown Azure Cost Management error."
                  return (
                      f"❌ Cost query failed for the last {days} day(s).\n"
                      f"The GitHub Azure identity may need Cost Management Reader permission.\n\n"
                      f"Azure response:\n{short}"
                  )

              try:
                  data = json.loads(p.stdout or "{}")
                  props = data.get("properties", {})
                  columns = props.get("columns", [])
                  rows = props.get("rows", [])
              except Exception as e:
                  return f"❌ Could not parse Azure cost data: {e}"

              if not rows:
                  return (
                      f"💰 Cost — last {days} day(s)\n"
                      f"Resource group: {RG}\n"
                      f"No cost data is available yet for this period."
                  )

              names = [str(c.get("name", "")) for c in columns]
              lower = [n.lower() for n in names]

              cost_idx = None
              for candidate in ("pretaxcost", "totalcost", "cost"):
                  if candidate in lower:
                      cost_idx = lower.index(candidate)
                      break

              currency_idx = lower.index("currency") if "currency" in lower else None

              if cost_idx is None:
                  return (
                      f"❌ Azure returned cost data, but no cost column was found.\n"
                      f"Columns: {', '.join(names)}"
                  )

              total = 0.0
              currencies = set()
              for row in rows:
                  try:
                      total += float(row[cost_idx] or 0)
                  except Exception:
                      pass
                  if currency_idx is not None and len(row) > currency_idx and row[currency_idx]:
                      currencies.add(str(row[currency_idx]))

              currency = ", ".join(sorted(currencies)) if currencies else "currency unavailable"
              return (
                  f"💰 Cost — last {days} day(s)\n"
                  f"Scope: {RG}\n"
                  f"Latest available cost: {total:.4f} {currency}\n"
                  f"ℹ️ Azure cost data may arrive with a delay."
              )

          def dhaka_text(epoch):
              return datetime.fromtimestamp(int(epoch), DHAKA).strftime("%Y-%m-%d %I:%M %p")

          def remaining_text(epoch):
              sec = max(0, int(epoch) - int(time.time()))
              h, rem = divmod(sec, 3600)
              m = rem // 60
              return f"{h}h {m}m" if h else f"{m}m"

          def state_label(state):
              s = (state or "").lower()
              if "deallocated" in s:
                  return "🔴 DEALLOCATED"
              if "stopped" in s:
                  return "🟠 STOPPED (NOT DEALLOCATED)"
              if "running" in s:
                  return "🟢 RUNNING"
              return state or "Unknown"

          def status_message():
              state = power_state()
              deadline = current_deadline()
              label = state_label(state)
              if deadline > int(time.time()):
                  return (
                      f"🖥 {VM}\n"
                      f"Status: {label}\n"
                      f"⏳ Planned deallocation: {dhaka_text(deadline)}\n"
                      f"⌛ Remaining: {remaining_text(deadline)}\n"
                      f"⏰ Daily auto-start: {auto_start_text()} (Bangladesh time)"
                  )
              return (
                  f"🖥 {VM}\n"
                  f"Status: {label}\n"
                  f"⏳ Planned deallocation: not currently set\n"
                  f"⏰ Daily auto-start: {auto_start_text()} (Bangladesh time)"
              )

          def warning_keyboard(deadline):
              d = str(deadline)
              return [
                  [
                      {"text": "⏱ +30 min", "callback_data": f"keep30|{d}"},
                      {"text": "⏱ +1 hour", "callback_data": f"keep60|{d}"}
                  ],
                  [
                      {"text": "⏱ +2 hours", "callback_data": f"keep120|{d}"},
                      {"text": "⏱ +3 hours", "callback_data": f"keep180|{d}"}
                  ],
                  [
                      {"text": "⏱ +4 hours", "callback_data": f"keep240|{d}"}
                  ],
                  [
                      {"text": "📊 Status", "callback_data": f"status|{d}"},
                      {"text": "🛑 Deallocate now", "callback_data": f"shutdown|{d}"}
                  ]
              ]

          def send_warning(deadline):
              set_tags(WarningForEpoch=deadline)
              send(
                  f"⚠️ {VM} will be deallocated in about 5 minutes.\n"
                  f"Scheduled: {dhaka_text(deadline)}\n\n"
                  f"No response = automatic DEALLOCATION.",
                  warning_keyboard(deadline)
              )

          def deallocate(reason):
              az("vm", "deallocate", "-g", RG, "-n", VM, "--no-wait")
              set_tags(
                  RunUntilEpoch=0,
                  RunUntilLocal="none",
                  WarningForEpoch=0,
                  LastPowerState="deallocated"
              )
              send(f"🛑 {VM}: deallocation requested.\nReason: {reason}")

          def extend(minutes):
              now = int(time.time())
              old = current_deadline()
              base = old if old > now else now
              new_deadline = base + minutes * 60
              set_tags(
                  RunUntilEpoch=new_deadline,
                  RunUntilLocal=datetime.fromtimestamp(new_deadline, DHAKA).strftime("%Y-%m-%d_%H:%M"),
                  WarningForEpoch=0
              )
              send(
                  f"✅ {VM} extended by {minutes} minutes.\n"
                  f"New planned deallocation: {dhaka_text(new_deadline)}"
              )

          def start_vm():
              az("vm", "start", "-g", RG, "-n", VM)
              deadline = int(time.time()) + 30 * 60
              set_tags(
                  RunUntilEpoch=deadline,
                  RunUntilLocal=datetime.fromtimestamp(deadline, DHAKA).strftime("%Y-%m-%d_%H:%M"),
                  WarningForEpoch=0,
                  LastPowerState="running"
              )
              send(
                  f"🟢 {VM} started from Telegram.\n"
                  f"Automatic deallocation: {dhaka_text(deadline)}"
              )

          def process_update(update):
              cq = update.get("callback_query")
              if cq:
                  msg = cq.get("message") or {}
                  chat = msg.get("chat") or {}
                  if str(chat.get("id")) != CHAT_ID:
                      return
                  data = cq.get("data", "")
                  callback_id = cq.get("id")
                  parts = data.split("|", 1)
                  action = parts[0]
                  expected = int(parts[1]) if len(parts) == 2 and parts[1].isdigit() else 0
                  current = current_deadline()

                  if action != "status" and expected and current != expected:
                      answer_callback(callback_id, "This button has expired.")
                      return

                  if action == "keep30":
                      answer_callback(callback_id, "Extended +30 minutes")
                      extend(30)
                  elif action == "keep60":
                      answer_callback(callback_id, "Extended +1 hour")
                      extend(60)
                  elif action == "keep120":
                      answer_callback(callback_id, "Extended +2 hours")
                      extend(120)
                  elif action == "keep180":
                      answer_callback(callback_id, "Extended +3 hours")
                      extend(180)
                  elif action == "keep240":
                      answer_callback(callback_id, "Extended +4 hours")
                      extend(240)
                  elif action == "shutdown":
                      answer_callback(callback_id, "Deallocating VM")
                      deallocate("Telegram button")
                  elif action == "status":
                      answer_callback(callback_id, "Status sent")
                      send(status_message())
                  return

              msg = update.get("message") or {}
              chat = msg.get("chat") or {}
              if str(chat.get("id")) != CHAT_ID:
                  return
              raw_text = (msg.get("text") or "").strip()
              text = raw_text.split("@", 1)[0].lower()

              if text.startswith("/autostart"):
                  parts = raw_text.split()
                  now_local = datetime.now(DHAKA)

                  if len(parts) == 1 or (len(parts) >= 2 and parts[1].lower() == "status"):
                      send(
                          f"⏰ Daily auto-start: {auto_start_text()} (Bangladesh time)\n"
                          f"Use /autostart HH:MM to change it.\n"
                          f"Example: /autostart 07:30\n"
                          f"Use /autostart off to disable."
                      )
                      return

                  value = parts[1].strip().lower()

                  if value == "off":
                      set_tags(AutoStartEnabled="false")
                      send("⏰ Daily auto-start is now OFF.")
                      return

                  try:
                      chosen = datetime.strptime(value, "%H:%M")
                  except Exception:
                      send("❌ Invalid time. Use 24-hour HH:MM, for example /autostart 07:30")
                      return

                  hhmm = chosen.strftime("%H:%M")
                  today = now_local.strftime("%Y-%m-%d")
                  current_hhmm = now_local.strftime("%H:%M")

                  # If today's selected time already passed, do not start retroactively.
                  last_date = today if hhmm <= current_hhmm else "pending"

                  set_tags(
                      AutoStartEnabled="true",
                      AutoStartTime=hhmm,
                      AutoStartLastDate=last_date
                  )

                  send(
                      f"✅ Daily auto-start changed to {chosen.strftime('%I:%M %p')} Bangladesh time.\n"
                      f"VM will get a fresh 30-minute safety timer when auto-started."
                  )
                  return

              cost_days = {
                  "/cost1d": 1,
                  "/cost2d": 2,
                  "/cost3d": 3,
                  "/cost7d": 7,
                  "/cost30d": 30,
              }

              if text in cost_days:
                  send(cost_message(cost_days[text]))
                  return

              if text == "/status":
                  send(status_message())
              elif text == "/startvm":
                  start_vm()
              elif text == "/keep30":
                  extend(30)
              elif text == "/keep60":
                  extend(60)
              elif text == "/keep120":
                  extend(120)
              elif text == "/keep180":
                  extend(180)
              elif text == "/keep240":
                  extend(240)
              elif text in ("/deallocate", "/shutdown"):
                  deallocate("Telegram command")
              elif text == "/help":
                  send(
                      "Commands:\n"
                      "/status - show VM status, deallocation, and auto-start time\n"
                      "/cost1d - cost for last 1 day\n"
                      "/cost2d - cost for last 2 days\n"
                      "/cost3d - cost for last 3 days\n"
                      "/cost7d - cost for last 7 days\n"
                      "/cost30d - cost for last 30 days\n"
                      "/autostart HH:MM - set daily auto-start (Bangladesh time)\n"
                      "/autostart off - disable daily auto-start\n"
                      "/startvm - start VM with a 30-minute timer\n"
                      "/keep30 - add 30 minutes\n"
                      "/keep60 - add 1 hour\n"
                      "/keep120 - add 2 hours\n"
                      "/keep180 - add 3 hours\n"
                      "/keep240 - add 4 hours\n"
                      "/deallocate - deallocate VM now\n"
                      "/shutdown - alias for /deallocate\n"
                      "/help - show commands"
                  )

          # Keep Telegram's command menu useful.
          try:
              tg("setMyCommands", {
                  "commands": json.dumps([
                      {"command": "status", "description": "VM status, deallocation and auto-start"},
                      {"command": "cost1d", "description": "Cost for last 1 day"},
                      {"command": "cost2d", "description": "Cost for last 2 days"},
                      {"command": "cost3d", "description": "Cost for last 3 days"},
                      {"command": "cost7d", "description": "Cost for last 7 days"},
                      {"command": "cost30d", "description": "Cost for last 30 days"},
                      {"command": "autostart", "description": "Set daily auto-start: /autostart HH:MM"},
                      {"command": "startvm", "description": "Start VM for 30 minutes"},
                      {"command": "keep30", "description": "Extend by 30 minutes"},
                      {"command": "keep60", "description": "Extend by 1 hour"},
                      {"command": "keep120", "description": "Extend by 2 hours"},
                      {"command": "keep180", "description": "Extend by 3 hours"},
                      {"command": "keep240", "description": "Extend by 4 hours"},
                      {"command": "deallocate", "description": "Deallocate VM now"},
                      {"command": "help", "description": "Show commands"}
                  ])
              })
          except Exception as e:
              print("setMyCommands failed:", e)

          # Process all currently queued bot updates, then acknowledge them.
          max_update = None
          try:
              result = tg("getUpdates", {
                  "timeout": 0,
                  "allowed_updates": json.dumps(["message", "callback_query"])
              })
              for upd in result.get("result", []):
                  max_update = max(max_update or upd["update_id"], upd["update_id"])
                  process_update(upd)

              if max_update is not None:
                  # Confirm everything through max_update so the same command is not repeated.
                  tg("getUpdates", {"offset": int(max_update) + 1, "timeout": 0})
          except Exception as e:
              print("Telegram update processing issue:", e)

          # Dynamic daily auto-start (Bangladesh time).
          # The monitor runs every 5 minutes, so start may occur a few minutes after the selected time.
          now_local = datetime.now(DHAKA)
          today = now_local.strftime("%Y-%m-%d")
          current_hhmm = now_local.strftime("%H:%M")
          t_before_auto = tags()

          if "AutoStartTime" not in t_before_auto:
              # Keep the previous default of 06:00, but do not retroactively start today
              # if this feature is being initialized after 06:00.
              baseline_last = today if current_hhmm >= "06:00" else "pending"
              set_tags(
                  AutoStartEnabled="true",
                  AutoStartTime="06:00",
                  AutoStartLastDate=baseline_last
              )

          auto_enabled, auto_hhmm, auto_last_date = auto_start_settings()

          if auto_enabled and auto_last_date != today and current_hhmm >= auto_hhmm:
              current_state = power_state()
              current_stable = stable_state(current_state)

              if current_stable != "running":
                  print(f"Daily auto-start due at {auto_hhmm}. Starting VM...")
                  az("vm", "start", "-g", RG, "-n", VM)

                  deadline = int(time.time()) + 30 * 60
                  set_tags(
                      RunUntilEpoch=deadline,
                      RunUntilLocal=datetime.fromtimestamp(deadline, DHAKA).strftime("%Y-%m-%d_%H:%M"),
                      WarningForEpoch=0,
                      LastPowerState="running",
                      AutoStartLastDate=today
                  )

                  send(
                      f"⏰ Daily AUTO-START triggered.\n"
                      f"🟢 {VM} is RUNNING.\n"
                      f"Auto-start time: {auto_start_text()} Bangladesh time\n"
                      f"Automatic DEALLOCATION: {dhaka_text(deadline)}"
                  )
              else:
                  # Already running at the scheduled time; mark today handled.
                  set_tags(AutoStartLastDate=today)

          state = power_state()
          stable = stable_state(state)
          now = int(time.time())
          tnow = tags()
          last_state = str(tnow.get("LastPowerState", "") or "").lower()

          try:
              deadline = int(tnow.get("RunUntilEpoch", "0") or 0)
          except Exception:
              deadline = 0

          # Establish a baseline silently if the first observed stable state is OFF.
          # If the first observed state is RUNNING with no timer, treat it as an
          # external/manual start and attach the 30-minute safety timer.
          if not last_state and stable:
              if stable == "running":
                  if deadline <= now:
                      deadline = now + 30 * 60
                      set_tags(
                          RunUntilEpoch=deadline,
                          RunUntilLocal=datetime.fromtimestamp(deadline, DHAKA).strftime("%Y-%m-%d_%H:%M"),
                          WarningForEpoch=0,
                          LastPowerState="running"
                      )
                      send(
                          f"🟢 Manual/external VM start detected.\n"
                          f"A 30-minute safety timer was attached.\n"
                          f"Planned deallocation: {dhaka_text(deadline)}"
                      )
                  else:
                      set_tags(LastPowerState="running")
              else:
                  if stable == "stopped":
                      send(
                          f"🟠 VM is STOPPED but NOT DEALLOCATED.\n"
                          f"Requesting DEALLOCATION now to release compute allocation."
                      )
                      az("vm", "deallocate", "-g", RG, "-n", VM, "--no-wait")
                      set_tags(
                          RunUntilEpoch=0,
                          RunUntilLocal="none",
                          WarningForEpoch=0,
                          LastPowerState="deallocated"
                      )
                  else:
                      set_tags(LastPowerState=stable)
                      if deadline > 0:
                          set_tags(RunUntilEpoch=0, RunUntilLocal="none", WarningForEpoch=0)

          # Notify when the Azure Portal / VM itself changes state outside our bot.
          elif stable and stable != last_state:
              if stable == "running":
                  if deadline <= now:
                      deadline = now + 30 * 60
                      set_tags(
                          RunUntilEpoch=deadline,
                          RunUntilLocal=datetime.fromtimestamp(deadline, DHAKA).strftime("%Y-%m-%d_%H:%M"),
                          WarningForEpoch=0,
                          LastPowerState="running"
                      )
                  else:
                      set_tags(LastPowerState="running")

                  send(
                      f"🟢 Manual/external VM ON detected.\n"
                      f"Status: 🟢 RUNNING\n"
                      f"Planned deallocation: {dhaka_text(deadline)}"
                  )

              elif stable == "deallocated":
                  set_tags(
                      RunUntilEpoch=0,
                      RunUntilLocal="none",
                      WarningForEpoch=0,
                      LastPowerState="deallocated"
                  )
                  send(
                      f"🔴 Manual/external VM DEALLOCATION detected.\n"
                      f"Status: 🔴 DEALLOCATED\n"
                      f"Compute allocation has been released.\n"
                      f"Any previous deallocation timer was cleared."
                  )
                  deadline = 0

              elif stable == "stopped":
                  send(
                      f"🟠 Manual/external VM STOP detected.\n"
                      f"Status: 🟠 STOPPED (NOT DEALLOCATED)\n"
                      f"This is not the same as deallocated.\n"
                      f"Requesting DEALLOCATION now to release compute allocation."
                  )
                  az("vm", "deallocate", "-g", RG, "-n", VM, "--no-wait")
                  set_tags(
                      RunUntilEpoch=0,
                      RunUntilLocal="none",
                      WarningForEpoch=0,
                      LastPowerState="deallocated"
                  )
                  deadline = 0

          # Re-read after command processing / manual state detection.
          state = power_state()
          stable = stable_state(state)
          now = int(time.time())
          tnow = tags()

          try:
              deadline = int(tnow.get("RunUntilEpoch", "0") or 0)
          except Exception:
              deadline = 0

          warned_for = str(tnow.get("WarningForEpoch", "0"))

          if stable == "running" and deadline > 0:
              remaining = deadline - now

              if remaining <= 0:
                  deallocate("Safety timer expired")
              elif remaining <= 300 and warned_for != str(deadline):
                  send_warning(deadline)

          elif stable == "deallocated" and deadline > 0:
              set_tags(
                  RunUntilEpoch=0,
                  RunUntilLocal="none",
                  WarningForEpoch=0,
                  LastPowerState="deallocated"
              )

          elif stable == "stopped":
              send(
                  f"🟠 {VM} is STOPPED but NOT DEALLOCATED.\n"
                  f"Requesting DEALLOCATION now to release compute allocation."
              )
              az("vm", "deallocate", "-g", RG, "-n", VM, "--no-wait")
              set_tags(
                  RunUntilEpoch=0,
                  RunUntilLocal="none",
                  WarningForEpoch=0,
                  LastPowerState="deallocated"
              )

          print(status_message())
          PY
